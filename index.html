<!DOCTYPE html>
<html lang="sv" data-theme="teacher">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klassrumsverktyget</title>
  <meta name="description" content="Klassrumsverktyg för mellanstadiet — morgonskärm, lektionsplanering, trafikljusur, elevlista och översikt.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="app" class="app">
    <!-- Topbar: klassval + lägesmeny. Döljs i elevvy (styrs av router/tema). -->
    <header class="topbar" id="topbar">
      <div class="topbar__brand" title="Klassrumsverktyget">🏫</div>
      <nav class="mode-nav" id="mode-nav" aria-label="Lägen"></nav>
      <div class="topbar__spacer"></div>
      <div id="class-picker" class="class-picker"></div>
      <button id="open-student-view" class="btn btn--ghost" title="Öppna elevskärm i nytt fönster">🖥️ Elevskärm</button>
      <div id="sync-status" class="sync-status" title="Synkstatus" aria-live="polite"></div>
    </header>

    <!-- Här monterar router aktivt läge -->
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <noscript>Klassrumsverktyget kräver JavaScript.</noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
